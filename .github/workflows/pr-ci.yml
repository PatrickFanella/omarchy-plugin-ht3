name: PR CI

# Pull-request verification on GitHub-hosted runners. Main is verified and
# deployed by Gitea after the merge reaches it, so this runs only on pull
# requests and by hand.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and validate
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    container: archlinux:base-20260823.0.578598
    steps:
      - name: Pin Arch Linux Archive
        run: printf 'Server = https://archive.archlinux.org/repos/2026/09/19/$repo/os/$arch\n' > /etc/pacman.d/mirrorlist
      - name: Install test tools
        run: pacman -Syu --noconfirm git jq nodejs python quickshell qt5-declarative qt6-declarative
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test and compile the helper
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile bridge.py
      - name: Validate plugin and lint QML against Omarchy 4.0.4
        run: |
          git init /tmp/omarchy
          git -C /tmp/omarchy remote add origin https://github.com/basecamp/omarchy.git
          git -C /tmp/omarchy fetch --depth 1 origin c668141e9c42b13c80c9ca4ea108e11708c5e8a5
          git -C /tmp/omarchy checkout --detach FETCH_HEAD
          /tmp/omarchy/bin/omarchy-plugin-validate .
          qmllint -I /tmp/omarchy/shell Widget.qml

  ci-gate:
    name: CI gate
    if: always()
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every verification job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["RESULTS"])
          expected = {'test'}
          assert set(results) == expected, results
          for name, result in results.items():
              assert result["result"] == "success", name + " did not pass"
          PY
